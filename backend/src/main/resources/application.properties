server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/jobconnect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration (Max 5MB per file)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Application Uploads Directory
app.upload.dir=./uploads

# JWT Security Configuration
app.jwt.secret=9a67c48f2f9b8c3d6e5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e
app.jwt.expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=*
